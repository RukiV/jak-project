# Forge CI for this staging mirror.
#
# Deliberately NOT a copy of upstream's build matrix. Upstream runs Linux clang/gcc,
# Windows MSVC/clang and macOS Intel/ARM on every pull request, and macOS is hardware
# this homelab does not have. What this runs instead is the set that catches problems
# BEFORE a submission exists: formatting and lint, a Linux build plus unit tests, and
# an MSVC build.
#
# MSVC is here because it is the one compiler whose disagreements with clang are not
# caught by any other job in this file (/permissive-, two-phase lookup, missing
# transitive includes). Finding those only after an upstream pull request goes red
# costs a fix and a force-push on someone else's tracker.
#
# The earlier version of this comment rejected a Windows VM on the grounds that its
# cost was attributable to this one repository. That is no longer true: Proteus is
# maintained for launcher packaging and .NET work regardless, so this job is a
# marginal consumer of a host that already exists. Windows-clang is still skipped as
# redundant with the Linux clang job, and macOS is still uncovered.
#
# Runner: proteus-windows, instance-level, labels windows-2022 / windows-latest /
# windows / self-hosted, host backend (no container isolation).
#
# That runner needs Chocolatey's allowGlobalConfirmation feature enabled. The
# MSVC workflow installs nasm with `choco install` and no -y, which is fine on
# GitHub's hosted images because they ship that feature on. A stock Chocolatey
# does not, so the step stops at an interactive prompt with no stdin and hangs
# until the job timeout rather than failing. This cost 15 minutes on the first
# real run. The fix lives in alex/forgejo-runner-windows, not here, so upstream's
# reusable workflow can keep being called unmodified.
#
# Forgejo prefers .forgejo/workflows over .github/workflows, but that preference is
# resolved PER REF, not repository-wide. A ref carrying no .forgejo/workflows directory
# falls back to .github/workflows and runs upstream's matrix in full, which here fails in
# seconds against windows-2022 and macos-15 labels that no runner provides. Only develop
# carries this file, so only develop is covered by the preference.
#
# What keeps that fallback from firing on pull requests is upstream's own trigger filter:
# every workflow in .github/workflows is `branches: [master]`, and for a pull_request that
# filter matches the BASE ref. So a pull request based on develop cannot match them, while
# one based on master runs the whole matrix red. Base forge pull requests on develop.
#
# Runner: atlas-ci, instance-level, labels ubuntu-22.04 / ubuntu-latest / self-hosted,
# backed by catthehacker/ubuntu:act-22.04.

name: Forge CI

# One live run per pull request: a newer push cancels the superseded build rather than
# running alongside it. The group is keyed on the PR number because under
# pull_request_target github.ref is the BASE branch, so a ref-keyed group would make
# unrelated pull requests cancel each other. The fallback arm keeps non-PR events
# (workflow_dispatch today) in their own per-ref group, so a dispatch never cancels
# or is cancelled by a pull request run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  # No push trigger. Merges here are fast-forward-only, so the commit that lands on
  # develop is byte-identical to the PR head that pull_request_target just tested green;
  # a post-merge run re-tests the same sha and adds nothing. The cost is that a direct
  # push to develop gets no CI, which branch protection reserves for the whitelisted
  # owner anyway.

  # Lets a run be re-triggered without an empty or throwaway commit. Earned the
  # hard way: the runner host needed three separate fixes before the MSVC job
  # got past setup, and each retry otherwise meant another commit on develop.
  workflow_dispatch:

  # pull_request_target, not pull_request, and the reason is structural. Branches here are
  # cut from master so their upstream diff stays clean, and master deliberately does not
  # carry this file. A pull_request event resolves the workflow from the HEAD ref, which
  # therefore does not have it; worse than getting no CI, that falls back to
  # .github/workflows and runs upstream's matrix. pull_request_target resolves from the
  # BASE ref, which is develop, which does have it.
  #
  # The tradeoff is real: pull_request_target runs with the base repository's context, and
  # the checkout below deliberately takes the pull request's head so that the code under
  # test is the code being proposed. That means untrusted code runs with that context.
  # Since 2026-08-07 the repository has a second collaborator, so the original "exactly
  # one collaborator" justification no longer holds. What contains the exposure today:
  # the Actions secret store carries exactly two least-privilege tokens (the ntfy
  # publish token, scoped to one topic, and a read-only upstream token for reconcile),
  # and the automatic token's identity is not on develop's or master's push or merge
  # whitelists, so a hostile PR cannot reach a protected branch, and what a leak could
  # cost is bounded to those two tokens' narrow scopes. Retire this trigger for plain
  # pull_request if contributor branches ever consistently carry this file.
  pull_request_target:

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # On pull_request_target the default checkout is the BASE. Take the head so the
          # run tests the proposed change; github.sha covers workflow_dispatch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Modern git spawns `maintenance run --auto` DETACHED and SILENT after a fetch
      # (no "Auto packing" banner the old auto-gc printed), and in this shallow clone
      # it can rewrite .git/shallow while a later step's own `git fetch` is mid-read.
      # That is the exact "fatal: shallow file has changed since we read it" that
      # killed four runs on 2026-08-18, every one at a job's SECOND sequential fetch
      # and one with the runner otherwise fully idle, which rules out every
      # cross-run theory. Evidence trail on the forge (the shallow-race issue).
      # Retire this only if the steps below stop fetching into the checkout's clone.
      - name: Disable detached repo maintenance (races our sequential fetches)
        run: |
          git config gc.auto 0
          git config gc.autoDetach false
          git config maintenance.auto false

      # AGENTS.md requires the (AI-assisted) marker on contributor commits; nothing
      # checked it mechanically until #88 (a violation shipped in the PR #85 follow-up
      # and only human review caught it, days late). The rule binds contributors, not
      # the maintainer, so maintainer-authored commits are exempt, and develop-sync
      # merge commits are skipped. The walk uses the API instead of git log because the
      # shallow checkout has no history, and the API lists exactly the commits the
      # merge would bring.
      - name: Check contributor commits for the (AI-assisted) disclosure
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          TOKEN: ${{ github.token }}
          COMMITS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits?limit=100
          MAINTAINER_EMAIL: semeaj@pm.me
        run: |
          set -eu
          commits="$(curl -sSf -H "Authorization: token $TOKEN" "$COMMITS_URL")"
          count="$(echo "$commits" | jq 'length')"
          if [ "$count" -ge 100 ]; then
            echo "::error::PR has $count or more commits, beyond this check's single-page walk; split the PR or extend the pagination"
            exit 1
          fi
          violations="$(echo "$commits" | jq -r --arg m "$MAINTAINER_EMAIL" '
            .[]
            | select((.parents | length) < 2)
            | select(.commit.author.email != $m)
            | select(.commit.message | contains("(AI-assisted)") | not)
            | .sha[0:9] + " by " + .commit.author.email + ": " + (.commit.message | split("\n")[0])
          ')"
          if [ -n "$violations" ]; then
            printf '%s\n' "$violations" | while IFS= read -r v; do
              echo "::error::contributor commit lacks the (AI-assisted) disclosure required by AGENTS.md: $v"
            done
            exit 1
          fi
          echo "disclosure check: $count commits walked, no violations"

      # Pinned to 18 on purpose. Later clang-format releases disagree with this codebase
      # (braced-init-list bin packing, among others) and will fail a clean tree, so a
      # newer one produces false failures and, worse, reformats code that CI then rejects.
      #
      # Installed from PyPI rather than apt. Upstream's job does `apt install
      # clang-format-18`, which only works because GitHub's hosted ubuntu-22.04 image
      # ships the LLVM apt sources pre-configured. Jammy's own repos stop at 14, so on a
      # stock 22.04 container that install fails with "Unable to locate package". The
      # wheel delivers the identical binary with no apt source wrangling.
      - name: Install clang-format 18
        run: |
          python3 -m pip install --quiet --user clang-format==18.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Assert the version rather than trust it: the whole point of pinning is defeated
      # if some other clang-format wins on PATH.
      - name: Verify clang-format version
        run: |
          set -e
          got="$("$HOME/.local/bin/clang-format" --version)"
          echo "$got"
          case "$got" in
            *"version 18."*) ;;
            *) echo "FATAL: expected clang-format 18.x, got: $got" >&2; exit 1 ;;
          esac

      - name: Check formatting
        run: |
          chmod +x ./third-party/run-clang-format/run-clang-format.py
          ./third-party/run-clang-format/run-clang-format.py \
            -r common decompiler game goalc test tools lsp \
            --color always \
            --clang-format-executable "$HOME/.local/bin/clang-format"

      # AGENTS.md section 12. A mechanism can land fully wired and never run because
      # nothing sets the symbol gating it; issue #176 catalogues 68 such levers and
      # #171 cost a day of tracing. This is a RATCHET on the diff: the tree carries a
      # large pre-existing backlog, and failing on that would make every branch
      # unlandable, which is how a check gets deleted instead of obeyed.
      - name: No untracked deferrals added
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        run: |
          set -eu
          BASE="${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --depth=200 origin "$BASE"
          # The TOOLING comes from the base ref, the CONTENT from the head. A branch
          # cut before these scripts landed has no copy of them, and failing it for
          # that is punishing a pull request for its base commit rather than its
          # diff (this is exactly what happened to #146). It is the same split
          # pull_request_target already applies to the workflow definition itself,
          # and it has the useful side effect that the gate cannot be evaded by
          # deleting the script on the branch.
          GUARDS="$(mktemp -d)"
          git show "origin/$BASE:scripts/check_deferred_markers.py" > "$GUARDS/check_deferred_markers.py"
          python3 "$GUARDS/check_deferred_markers.py" --mode diff --base "origin/$BASE"

      # docs/inert-inventory.md is generated from the tree and committed. Failing on
      # staleness rather than on comment wording is the point: it catches a mechanism
      # left inert even when nobody wrote a note, which is the dangerous case and the
      # one a comment grep can never see. It is also the rule AGENTS.md section 2
      # already applies to every other generated file.
      #
      # The failure is always actionable and never a judgement call: run --write and
      # commit. The diff then shows review exactly what the branch armed or disarmed.
      - name: Inert-mechanism ledger is up to date
        run: |
          set -eu
          BASE="${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --depth=200 origin "$BASE"
          # Unlike the deferral gate, this one cannot be salvaged with base tooling
          # alone: a branch predating the ledger has no docs/inert-inventory.md, so
          # regenerating would always report the whole file as drift. Skip, but say
          # so at notice level rather than silently, because a gate that quietly
          # does nothing is worse than one that fails honestly.
          if [ ! -f docs/inert-inventory.md ]; then
            echo "::notice::This branch predates docs/inert-inventory.md, so the ledger check is skipped. Rebase past f6e086056 to enable it."
            exit 0
          fi
          GUARDS="$(mktemp -d)"
          git show "origin/$BASE:scripts/gen_inert_ledger.py"   > "$GUARDS/gen_inert_ledger.py"
          git show "origin/$BASE:scripts/find_unarmed_levers.py" > "$GUARDS/find_unarmed_levers.py"
          python3 "$GUARDS/gen_inert_ledger.py" --check

      # decompiler/config/jakx/all-types.gc loads top to bottom, and a LATER
      # declaration of a name silently wins over an earlier one. The recurring
      # shape: an early, evidence-backed define-extern (or a full deftype) gets
      # overridden by a later, weaker bulk "provisional: call-site evidence
      # only" entry, and the earlier declaration keeps reading as though it is
      # in effect while the compiler quietly uses the weaker one. This used to
      # be a RATCHET on the diff, because the tree carried a large pre-existing
      # backlog when the checker landed (dozens of conflicting duplicates
      # already committed) and failing on that backlog would have made every
      # branch unlandable. The dedicated sweep that cleared it fixed all 63
      # conflicting duplicates and dropped the 28 byte-identical redundant
      # ones, so the backlog is zero and the whole file can be held to it:
      # flipped to --mode absolute, which fails on ANY conflicting duplicate
      # in the tree, not just ones newly introduced by the branch under test.
      - name: No all-types.gc shadowing duplicates
        run: |
          set -eu
          BASE="${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --depth=200 origin "$BASE"
          # TOOLING still comes from the base ref, not the branch under test,
          # so the gate cannot be evaded by editing or deleting the checker on
          # the branch under test. A base predating the script has nothing to
          # fetch, so skip with a notice rather than fail.
          if ! git show "origin/$BASE:scripts/check_alltypes_shadowing.py" > /dev/null 2>&1; then
            echo "::notice::This branch's base predates scripts/check_alltypes_shadowing.py, so the all-types shadowing check is skipped."
            exit 0
          fi
          GUARDS="$(mktemp -d)"
          git show "origin/$BASE:scripts/check_alltypes_shadowing.py" > "$GUARDS/check_alltypes_shadowing.py"
          python3 "$GUARDS/check_alltypes_shadowing.py" --mode absolute

      # A virtual defstate whose parent state is declared but not yet landed
      # compiles green and null-dereferences at kernel link (construction-obs-h
      # took develop's boot down on 2026-08-17 with every gate passing). The
      # checker models link order from the DGO listings; same base-ref tooling
      # split as the steps above.
      - name: No virtual defstate inherits an unlanded parent state
        run: |
          set -eu
          BASE="${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --depth=200 origin "$BASE"
          if ! git show "origin/$BASE:scripts/check_state_inherit.py" > /dev/null 2>&1; then
            echo "::notice::This branch's base predates scripts/check_state_inherit.py, so the virtual-state inheritance check is skipped."
            exit 0
          fi
          GUARDS="$(mktemp -d)"
          git show "origin/$BASE:scripts/check_state_inherit.py" > "$GUARDS/check_state_inherit.py"
          python3 "$GUARDS/check_state_inherit.py" --root .

      - name: Required checks
        run: |
          python3 ./scripts/ci/lint-trailing-whitespace.py
          python3 ./scripts/gsrc/check-for-conflicts.py
          python3 ./scripts/ci/check-for-asserts.py
          python3 ./scripts/ci/lint-characters.py
          python3 ./scripts/ci/lint-autoglottonyms.py

  build-and-test:
    name: Linux clang build and unit tests
    runs-on: ubuntu-22.04
    # Staged behind lint, as is the MSVC job below. Lint finishes in about a minute
    # and catches the commonest reds (formatting, the deferral ratchet, the inert
    # ledger); the builds cost fifteen runner-minutes between them, most of it on
    # the serial Windows runner. Gating them means a doomed run stops at the cheap
    # verdict instead of burning the queue, which is what a stacked afternoon of
    # pull requests actually contends for. The price is about one minute of added
    # latency on a green run. A build failing while its sibling still runs is NOT
    # covered: cancelling a running sibling needs watchdog machinery that costs
    # more than the minutes it saves.
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # On pull_request_target the default checkout is the BASE. Take the head so the
          # run tests the proposed change; github.sha covers workflow_dispatch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Modern git spawns `maintenance run --auto` DETACHED and SILENT after a fetch
      # (no "Auto packing" banner the old auto-gc printed), and in this shallow clone
      # it can rewrite .git/shallow while a later step's own `git fetch` is mid-read.
      # That is the exact "fatal: shallow file has changed since we read it" that
      # killed four runs on 2026-08-18, every one at a job's SECOND sequential fetch
      # and one with the runner otherwise fully idle, which rules out every
      # cross-run theory. Evidence trail on the forge (the shallow-race issue).
      # Retire this only if the steps below stop fetching into the checkout's clone.
      - name: Disable detached repo maintenance (races our sequential fetches)
        run: |
          git config gc.auto 0
          git config gc.autoDetach false
          git config maintenance.auto false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang gcc g++ lcov make \
            nasm libxrandr-dev libxinerama-dev libxcursor-dev libpulse-dev \
            libxi-dev zip ninja-build libgl1-mesa-dev libssl-dev

      # No sccache here. Upstream's setup uses GitHub's hosted Actions Cache service,
      # which this instance does not provide. Atlas has the cores to absorb a cold build.
      #
      # Release-linux-clang rather than upstream's -asan variant: ASAN roughly doubles
      # build time and slows the test run considerably, and its value is finding
      # memory errors that upstream's matrix will catch at submission anyway.
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build --preset=Release-linux-clang

      - name: Build
        run: cmake --build build --parallel $(nproc)

      # 1509 tests, no ISO data required, no GPU required.
      - name: Unit tests
        run: ./build/goalc-test --gtest_color=yes --gtest_filter="-*MANUAL_TEST*"

  # This job deliberately does NOT call .github/workflows/windows-build-msvc.yaml,
  # even though doing so was the original design and the reason this runner
  # registers the windows-2022 label. Two things on a persistent, self-hosted
  # runner make the reusable workflow unusable as-is, and neither can be fixed
  # from the calling side:
  #
  # 1. Project path. jak-project finds its project directory by string-matching
  #    "jak-project" in the running executable's own path, in
  #    common/util/FileUtil.cpp try_get_project_path_from_path. GitHub checks out
  #    to D:\a\jak-project\jak-project so that matches. forgejo-runner checks
  #    out to <random>\hostexecutor, hardcoded in act/runner/run_context.go, so
  #    it does not. goalc-test, goalc and gk now accept --proj-path to override
  #    the default, but the checkout into a jak-project-named subdirectory is
  #    kept deliberately for CI simplicity; only the caller of actions/checkout
  #    can arrange the directory name.
  #
  # 2. sccache. Upstream starts the server with SCCACHE_IDLE_TIMEOUT=0, so it
  #    never exits. GitHub destroys the VM after each job; a persistent runner
  #    does not, and the next job's --start-server fails with "Address in use".
  #    Verified against a healthy server, not just a stale one.
  #
  # The steps below otherwise mirror upstream's file. Keep them in sync when it
  # changes. This lives in .forgejo/ which is never submitted upstream, so the
  # duplication costs maintenance but does not dirty the upstream diff. Patching
  # FileUtil.cpp instead was rejected: it would make develop differ from upstream
  # in source, which is a worse thing to carry than a duplicated workflow.
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-2022
    # Staged behind lint; see the rationale on build-and-test.
    needs: lint
    timeout-minutes: 60

    # sccache is configured here rather than by hendrikmuhs/ccache-action, which this
    # job used until it was measured: 18 saved cache entries, 18 distinct versions,
    # "No cache found." on every restore and a 0.44% hit rate. That action tars the
    # cache and ships it through the Actions cache service because GitHub's hosted
    # runners are destroyed after each job. proteus-windows is persistent and always
    # on, so a directory on local disk simply survives, and actions/cache identifies
    # an entry by (key, version) where version hashes the cache PATHS. The action put
    # those paths inside the per-run workspace, whose name is a fresh random hash every
    # run, so the version never repeated and no run could read another's cache.
    env:
      # Outside the workspace on purpose. Anything under work\<hash>\ is a new
      # directory every run, which is what made the old arrangement unreadable.
      SCCACHE_DIR: C:\forgejo-runner\sccache
      SCCACHE_CACHE_SIZE: 20G
      # The runner is persistent, so the server should outlive the job rather than
      # idle out between them.
      SCCACHE_IDLE_TIMEOUT: 0

      # SCCACHE_BASEDIRS is deliberately NOT set, and should not be added back.
      #
      # It looks like the right answer and is not. It was tried here first, and two
      # consecutive runs on the same commit both reported 0.44% and 1137 misses while
      # `sccache -s` cheerfully displayed a populated "Base directories" line. Upstream
      # #2736 taught it to strip basedirs from MSVC preprocessor output and is in
      # 0.17.0, but #2711, stripping them from cmdline args and the direct-mode hash
      # key, is still open. This build runs in direct mode, so the stripping never
      # reaches the hash that decides a hit.
      #
      # The stable checkout path below is what actually produces hits, and it makes
      # basedirs unnecessary rather than merely broken.

    steps:
      - name: Stop any leftover sccache server
        # A running server keeps the configuration it was started with, so the env
        # above only takes effect if no server survives from an earlier job. On a
        # persistent runner one usually does, which makes this step load-bearing
        # rather than tidy-up.
        #
        # cmd, not powershell. PowerShell turns a native command's stderr into a
        # NativeCommandError when it is piped, which terminates the step before
        # any trailing "exit 0" can run. sccache writes to stderr and exits 2
        # when no server is running, the normal case after a reboot, so the
        # message is discarded and the exit code forced to 0.
        shell: cmd
        run: |
          sccache --stop-server 2>nul
          exit /b 0

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # On pull_request_target the default checkout is the BASE, matching the
          # other jobs above. Without this the MSVC job would build develop rather
          # than the proposed change, so it could pass while the change it is
          # meant to gate does not compile.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Same shallow-maintenance guard as the Linux jobs above; see the comment there.
      - name: Disable detached repo maintenance (races our sequential fetches)
        run: |
          git config gc.auto 0
          git config gc.autoDetach false
          git config maintenance.auto false
          # Not the workspace root: jak-project resolves its project directory by
          # string-matching "jak-project" in the executable's own path, so the
          # checkout has to sit in a directory of that name or goalc-test cannot
          # find the repo. See alex/jak-project#47.
          path: jak-project

      - name: Install NASM
        run: |
          choco install nasm --source="${{ github.workspace }}/jak-project/third-party/nasm"

      - name: Mirror the checkout to a stable path
        # The compile has to happen at a path that does not change between runs, or
        # sccache cannot hit. Its hash covers the absolute paths on the command line,
        # and Forgejo hands every job a workspace named work\<random hash>\, so every
        # file hashes differently every time. SCCACHE_BASEDIRS is the intended remedy
        # and does not work here; see the note in the job env above.
        #
        # Mirrored rather than checked out straight to C:\ci: actions/checkout keeps
        # the credentials and the pull_request_target head-sha semantics, and this
        # step only relocates the tree it produced.
        #
        # /MIR purges anything in the destination that is not in the source, which
        # deletes build\ from the previous run. That is deliberate. Each run still
        # gets a clean configure and a full build graph exactly as it does today, so
        # the only thing that changes is the path; the speedup comes from sccache
        # serving the objects, not from reusing a build tree across pull requests.
        #
        # The directory has to be named jak-project. goalc-test resolves the project
        # root by string-matching "jak-project" in its own executable path, so
        # C:\ci\jak-project\build\bin\goalc-test.exe resolves and C:\ci\src would not.
        # See alex/jak-project#47.
        shell: cmd
        run: |
          robocopy "%GITHUB_WORKSPACE%\jak-project" "C:\ci\jak-project" /MIR /NFL /NDL /NJH /NJS /NP /R:2 /W:5
          rem robocopy exit codes below 8 are success; 1 means files were copied.
          if %ERRORLEVEL% GEQ 8 exit /b 1
          exit /b 0

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Start sccache
        # Started explicitly so it picks up the job env above, rather than being
        # started lazily by the first compile with whatever environment that step
        # happened to carry. Counters are zeroed so the stats at the end describe
        # this run only; -z does not touch the cached objects.
        shell: cmd
        run: |
          if not exist "%SCCACHE_DIR%" mkdir "%SCCACHE_DIR%"
          sccache --start-server 2>nul
          sccache -z

      - name: CMake Generation - MSVC
        shell: cmd
        working-directory: C:\ci\jak-project
        run: cmake -B build --preset=Release-windows-msvc -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache .

      - name: Build Project
        shell: cmd
        working-directory: C:\ci\jak-project
        run: |
          set CL=/MP
          cmake --build build --parallel %NUMBER_OF_PROCESSORS%

      - name: sccache stats
        # The number that says whether any of this worked. A run that reports a hit
        # rate near zero means the cache is broken again, most likely because
        # something started putting SCCACHE_DIR back inside the workspace or a
        # stale server survived with the old configuration. Runs on failure too,
        # since a build that broke is exactly when the stats are worth seeing.
        if: always()
        shell: cmd
        run: sccache -s

      - name: Run Tests
        timeout-minutes: 10
        working-directory: C:\ci\jak-project
        env:
          GTEST_OUTPUT: "xml:opengoal-test-report.xml"
        run: |
          ./build/bin/goalc-test.exe --gtest_color=yes --gtest_brief=0 --gtest_filter="-*MANUAL_TEST*"

  # Reports the run once, as the aggregate of every job above. This job's own
  # job.status is its own success, not the run's, so the aggregate is passed in
  # explicitly. With the builds staged behind lint, a lint failure arrives here as
  # "failure skipped skipped", which the action's substring matching (failure
  # outranks cancelled outranks success) already reports as failure; a green run
  # is "success success success". Skipped never appears alone: a run where
  # everything was skipped does not schedule this job at all.
  #
  # if: always() so a failed or partly-skipped run still reports. A notification
  # that only ever fires on green is indistinguishable from a dead channel, which
  # is the case worth covering.
  #
  # Runs on the Linux runner: it needs curl and nothing else, and pinning it to
  # the Windows host would make notification depend on the scarcer runner. Under
  # queue pressure the event can lag the last real job by minutes; that is
  # accepted, because the event is a wake-up signal, not a gate, and the commit
  # statuses are current the moment each job ends for anything that needs the
  # verdict immediately.
  results:
    name: Results
    runs-on: ubuntu-22.04
    needs: [lint, build-and-test, windows-msvc]
    if: always()
    steps:
      - name: Notify ntfy
        continue-on-error: true
        uses: https://git.snalpha.com/alex/action-ntfy-notify@main
        with:
          token: ${{ secrets.NTFY_CI_TOKEN }}
          url: ${{ vars.NTFY_CI_URL }}
          status: ${{ join(needs.*.result, ' ') }}
